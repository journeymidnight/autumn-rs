[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autumn-memory"
version = "0.1.0"
description = "Ergonomic agent-memory layer over the autumn-rs MemoryStore (autumn.Memory)"
requires-python = ">=3.9"
# Depends on the `autumn` PyO3 binding (built from python/, lib name `autumn`).
dependencies = []

[tool.setuptools.packages.find]
include = ["autumn_memory*"]
