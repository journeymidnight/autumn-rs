[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autumn-memory-mcp"
version = "0.1.0"
description = "stdio MCP server exposing autumn-memory (search/fetch/add/update/delete + episodic/facts)"
requires-python = ">=3.10"
# `mcp` is the Model Context Protocol SDK; `autumn-memory` is the ergonomic
# layer over the `autumn` PyO3 binding (which itself is built from `python/`
# via maturin — it is not on PyPI, so install it from this tree).
dependencies = ["mcp>=1.0", "anyio>=4", "autumn-memory"]

[project.scripts]
autumn-memory-mcp = "autumn_memory_mcp.server:main"

[tool.setuptools.packages.find]
include = ["autumn_memory_mcp*"]
