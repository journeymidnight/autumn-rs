[package]
rust-version = "1.95"
name = "autumn-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "autumn"
crate-type = ["cdylib"]

[features]
# Compile in the UCX transport (the published wheels have it). UCX is loaded
# from the host at run time, by `autumn.set_transport("ucx")` before connect;
# without it the wheel still works over TCP.
ucx = ["autumn-client/ucx", "autumn-rpc/ucx", "autumn-transport/ucx"]
# One wheel for every CPython >= 3.11 (`maturin build --release --features abi3`
# tags it cp311-abi3); the published wheels are built this way. 3.11 is the
# floor because the buffer protocol the zero-copy reads use (`PyBuffer`) entered
# the limited API there. Without it the wheel is bound to the interpreter it was
# built with, which is what a source build for an older CPython needs.
abi3 = ["pyo3/abi3-py311"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
autumn-client = { path = "../crates/client" }
autumn-rpc = { path = "../crates/rpc" }
autumn-transport = { path = "../crates/transport" }
# The `fs/` tree behind the `autumn.Fs` PyO3 binding: the same layer the fuse
# mount and the S3 gateway use, with no kernel-mount machinery in the wheel.
autumn-fs = { path = "../crates/fs" }
# `polling` is not a second driver, it is what makes the driver a CHOICE: only
# with io-uring AND polling does compio-driver define cfg(fusion), and only the
# fusion driver probes the running kernel before picking. See the workspace
# Cargo.toml for the whole story — this crate needs its own copy of both knobs
# because it is `exclude`d from that workspace and inherits nothing from it.
compio = { version = "0.19.2", features = ["runtime", "time", "polling"] }
futures = "0.3"
bytes = "1"
libc = "0.2"

# compio closes the socket its own fallback just made — see the workspace
# Cargo.toml for the full account. This crate is `exclude`d from that workspace,
# so the patch there does NOT reach the wheel: without this copy the PyO3 client
# ships the broken driver and every connection it opens dies with
# `Bad file descriptor (os error 9)` — the Python client stays broken even
# after the servers are fixed.
#
# Keep the two sections in step. Drop both once the fix is released upstream.
[patch.crates-io]
compio = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-buf = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-dispatcher = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-driver = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-executor = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-fs = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-io = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-log = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-macros = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-net = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-quic = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-runtime = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-tls = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
compio-ws = { git = "https://github.com/thesues/compio.git", branch = "fix/createsocket-blocking-fallback-double-own" }
