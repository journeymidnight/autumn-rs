[package]
name = "autumn-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "autumn"
crate-type = ["cdylib"]

[features]
# Build the wheel with `maturin build --features ucx` to compile in the UCX
# transport. At runtime call `autumn.set_transport("ucx")` before connect.
ucx = ["autumn-client/ucx", "autumn-rpc/ucx", "autumn-transport/ucx"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
autumn-client = { path = "../crates/client" }
autumn-rpc = { path = "../crates/rpc" }
autumn-transport = { path = "../crates/transport" }
autumn-memory = { path = "../crates/autumn-memory" }
# F-FS-UNIFY M2: the fuser-FREE filesystem core (meta/dir/extent/read/write/
# state) behind the `autumn.Fs` PyO3 binding. `default-features = false` keeps
# `fuser`/`clap`/kernel-mount machinery out of the wheel — only the shared
# inode-layout logic the fuse binary also uses.
autumn-fuse = { path = "../crates/fuse", default-features = false, features = ["core"] }
compio = { version = "0.18", features = ["runtime", "time"] }
futures = "0.3"
bytes = "1"
libc = "0.2"
