name: image
# The all-roles container image, published to ghcr.io for linux/amd64 and
# linux/arm64. A `v*` tag publishes `<version>` and `latest`; a manual run
# publishes `sha-<commit>` only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/k8s/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          d='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
          flavor: latest=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Tag the multi-arch image
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect '${{ env.IMAGE }}:${{ steps.meta.outputs.version }}'

  # The README's compose walkthrough against the image just published, pulled
  # without logging in, the way a new user pulls it.
  compose-smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AUTUMN_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.publish.outputs.version }}
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - run: $COMPOSE up -d
      - name: Put and get through the cli service
        run: |
          for i in $(seq 36); do
            out=$($COMPOSE run --rm cli sh -c 'echo hello > /tmp/v && autumn-client --manager manager:9001 --namespace kvc put greeting /tmp/v && autumn-client --manager manager:9001 --namespace kvc get greeting' 2>&1) \
              && grep -q hello <<<"$out" && { echo "ready on attempt $i, after $SECONDS s"; exit 0; }
            echo "attempt $i: $(tail -n1 <<<"$out")"
            sleep 5
          done
          exit 1
      - name: Dashboard answers
        run: curl -fsS -o /dev/null http://127.0.0.1:8799/api/overview
      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 100
