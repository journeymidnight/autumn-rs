name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y etcd-server protobuf-compiler
      - name: Format (gating, FCI-01)
        run: cargo fmt --all -- --check
      # FCI-01: gating. Scope excludes `--benches` deliberately — the 3 perf
      # benches (stream append/extent, rpc ps_read) are stale against current
      # APIs and don't compile; see feature_list.md FCI-01. lib + bins + tests +
      # examples (the maintained code) must be clippy-clean under -D warnings.
      - name: Clippy (gating, FCI-01)
        run: cargo clippy --workspace --exclude autumn-fuse --lib --bins --tests --examples -- -D warnings
      - name: Build
        run: cargo build --workspace --exclude autumn-fuse
      - name: Unit tests
        run: cargo test --workspace --lib --exclude autumn-fuse
      - name: Integration tests
        run: cargo test --workspace --tests --exclude autumn-fuse -- --test-threads=1
