name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Invalidate the cache one-shot: 120+ failed runs in a row likely
          # poisoned the cached `target/` with stale clippy fingerprints (a
          # known footgun — clippy can short-circuit on incremental rmeta
          # matches and skip re-checking lints, so a one-time bad cache
          # masks fixed source). Bump this string to invalidate again.
          prefix-key: "v2-clippy-1.96-clean"
          # Don't keep storing the broken state forward.
          cache-on-failure: false
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y etcd-server protobuf-compiler
      - name: Format (gating, FCI-01)
        run: cargo fmt --all -- --check
      # FCI-01 + FCI-02: gating on all targets (lib + bins + tests + examples +
      # benches). FCI-02 refreshed the 3 perf benches to current APIs so they
      # compile again; the whole workspace (sans autumn-fuse) is clippy-clean
      # under -D warnings.
      - name: Print rust toolchain info (diagnostic)
        run: |
          rustc --version --verbose
          cargo --version
          cargo clippy --version
      - name: Clippy (gating, FCI-01)
        id: clippy
        run: |
          set +e
          cargo clippy --workspace --exclude autumn-fuse --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
          rc=${PIPESTATUS[0]}
          echo "=================== clippy errors only ==================="
          grep -E '^(error|warning)' /tmp/clippy.log | head -50 || true
          exit $rc
      - name: Upload clippy log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: /tmp/clippy.log
          retention-days: 7
      - name: Build
        run: cargo build --workspace --exclude autumn-fuse
      - name: Unit tests
        run: cargo test --workspace --lib --exclude autumn-fuse
      - name: Integration tests
        run: cargo test --workspace --tests --exclude autumn-fuse -- --test-threads=1
