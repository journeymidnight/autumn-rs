name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Invalidate the cache one-shot: 120+ failed runs in a row likely
          # poisoned the cached `target/` with stale clippy fingerprints (a
          # known footgun — clippy can short-circuit on incremental rmeta
          # matches and skip re-checking lints, so a one-time bad cache
          # masks fixed source). Bump this string to invalidate again.
          prefix-key: "v2-clippy-1.96-clean"
          # Don't keep storing the broken state forward.
          cache-on-failure: false
      - name: Install system deps
        run: |
          sudo apt-get update
          # libfuse3-dev: needed by `fuser` (transitively pulled via
          # autumn-ioring → autumn-fuse{default-features=false}). cargo's
          # feature unification still resolves `fuser` even though we
          # `--exclude autumn-fuse` from build/clippy/test — the build
          # script panics without fuse3.pc on PKG_CONFIG_PATH. THIS was
          # the source of the "Clippy failed" misnomer across 120+ runs:
          # the panic happened during dependency compilation in the
          # clippy step, masquerading as a clippy failure.
          sudo apt-get install -y etcd-server protobuf-compiler libfuse3-dev
      - name: Format (gating, FCI-01)
        run: cargo fmt --all -- --check
      # FCI-01 + FCI-02: gating on all targets (lib + bins + tests + examples +
      # benches). FCI-02 refreshed the 3 perf benches to current APIs so they
      # compile again; the whole workspace (sans autumn-fuse) is clippy-clean
      # under -D warnings.
      - name: Clippy (gating, FCI-01)
        run: cargo clippy --workspace --exclude autumn-fuse --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --exclude autumn-fuse
      - name: Unit tests
        run: cargo test --workspace --lib --exclude autumn-fuse
      - name: Integration tests
        # Bump RLIMIT_MEMLOCK + nofile on this shell's PID so the cargo test
        # subprocess inherits the bump. Integration tests spawn manager + EN
        # threads each creating a compio io_uring runtime; rings accumulate
        # across test boundaries (the worker threads are `std::thread::spawn`'d
        # without joining — they keep their rings until process exit, so
        # --test-threads=1 doesn't help). Ubuntu-latest's default `ulimit -l`
        # is 64 KB; after ~9 tests' worth of rings, io_uring_setup returns
        # ENOMEM and Runtime::new().unwrap() panics with "Cannot allocate
        # memory".
        #
        # `ulimit -l unlimited` directly in the shell hits "Operation not
        # permitted" (RLIMIT_MEMLOCK is privileged on the runner). Use sudo
        # prlimit on $$ (this shell's PID) instead — GitHub runners have
        # passwordless sudo; the prlimit-modified shell then execs cargo
        # test which inherits the higher limit.
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited || true
          sudo prlimit --pid $$ --nofile=65536:65536 || true
          # diagnostic — confirm the new limits actually took
          cat /proc/$$/limits | grep -E 'locked|files'
          cargo test --workspace --tests --exclude autumn-fuse -- --test-threads=1
