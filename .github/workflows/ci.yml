name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Invalidate the cache one-shot: 120+ failed runs in a row likely
          # poisoned the cached `target/` with stale clippy fingerprints (a
          # known footgun — clippy can short-circuit on incremental rmeta
          # matches and skip re-checking lints, so a one-time bad cache
          # masks fixed source). Bump this string to invalidate again.
          prefix-key: "v2-clippy-1.96-clean"
          # Don't keep storing the broken state forward.
          cache-on-failure: false
      - name: Install system deps
        run: |
          sudo apt-get update
          # libfuse3-dev: needed by `fuser` (transitively pulled via
          # autumn-ioring → autumn-fuse{default-features=false}). cargo's
          # feature unification still resolves `fuser` even though we
          # `--exclude autumn-fuse` from build/clippy/test — the build
          # script panics without fuse3.pc on PKG_CONFIG_PATH. THIS was
          # the source of the "Clippy failed" misnomer across 120+ runs:
          # the panic happened during dependency compilation in the
          # clippy step, masquerading as a clippy failure.
          sudo apt-get install -y etcd-server protobuf-compiler libfuse3-dev
      - name: Format (gating, FCI-01)
        run: cargo fmt --all -- --check
      # FCI-01 + FCI-02: gating on all targets (lib + bins + tests + examples +
      # benches). FCI-02 refreshed the 3 perf benches to current APIs so they
      # compile again; the whole workspace (sans autumn-fuse) is clippy-clean
      # under -D warnings.
      - name: Clippy (gating, FCI-01)
        run: cargo clippy --workspace --exclude autumn-fuse --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --exclude autumn-fuse
      - name: Unit tests
        run: cargo test --workspace --lib --exclude autumn-fuse
      - name: Integration tests
        run: cargo test --workspace --tests --exclude autumn-fuse -- --test-threads=1
