name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Install system deps
        run: |
          sudo apt-get update
          # autumn-manager/fuse-tests pulls in autumn-fuse and fuser.
          sudo apt-get install -y etcd-server protobuf-compiler libfuse3-dev
      - name: Build
        run: cargo build --workspace --exclude autumn-fuse --exclude ucx-sys-mini
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dashboard contracts
        run: |
          node crates/server/src/bin/autumn_dashboard/tests/render_check.js
          node crates/server/src/bin/autumn_dashboard/tests/tabs_smoke.js
          node crates/server/src/bin/autumn_dashboard/tests/policy_controls.js
          bash crates/server/src/bin/autumn_dashboard/tests/api_contract.sh
      - name: Unit tests
        run: cargo test --workspace --lib --exclude autumn-fuse --exclude ucx-sys-mini
      - name: Integration tests
        # Bump RLIMIT_MEMLOCK + nofile on this shell's PID so the cargo test
        # subprocess inherits the bump. Integration tests spawn manager + EN
        # threads each creating a compio io_uring runtime; rings accumulate
        # across test boundaries (the worker threads are `std::thread::spawn`'d
        # without joining — they keep their rings until process exit, so
        # --test-threads=1 doesn't help). Ubuntu-latest's default `ulimit -l`
        # is 64 KB; after ~9 tests' worth of rings, io_uring_setup returns
        # ENOMEM and Runtime::new().unwrap() panics with "Cannot allocate
        # memory".
        #
        # `ulimit -l unlimited` directly in the shell hits "Operation not
        # permitted" (RLIMIT_MEMLOCK is privileged on the runner). Use sudo
        # prlimit on $$ (this shell's PID) instead — GitHub runners have
        # passwordless sudo; the prlimit-modified shell then execs cargo
        # test which inherits the higher limit.
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited || true
          sudo prlimit --pid $$ --nofile=65536:65536 || true
          # diagnostic — confirm the new limits actually took
          cat /proc/$$/limits | grep -E 'locked|files'
          cargo test --workspace --tests --exclude autumn-fuse --exclude ucx-sys-mini --features autumn-manager/fuse-tests -- --test-threads=1
