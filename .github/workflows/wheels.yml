name: wheels

# The `autumn-rs` Python distribution (`import autumn`) as one manylinux abi3
# wheel per architecture (CPython >= 3.11). Built on every push to main and on
# tags; uploaded as a workflow artifact. Publishing to PyPI is a separate step.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["python/**", "crates/**", ".github/workflows/wheels.yml"]

jobs:
  manylinux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --features abi3 --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: autumn-wheel-${{ matrix.target }}
          path: python/dist/*.whl
