[package]
name = "memory-browser"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
autumn-client = { path = "../../crates/client" }
autumn-memory = { path = "../../crates/autumn-memory" }
anyhow.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
compio = { version = "0.18", features = ["macros", "net"] }
axum = { version = "0.8" }
cyper-axum = "0.8"
send_wrapper = { version = "0.6", features = ["futures"] }
futures = "0.3"
serde_json = "1"
# Optional Model2Vec-style static int8 embedder (real semantics, no service).
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }

[features]
default = []
static-embed = ["dep:tokenizers"]

[lints]
workspace = true
