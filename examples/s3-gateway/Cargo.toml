[package]
name = "autumn-s3"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Read-only S3-compatible gateway over autumn's `fs/` tree. It exists so
# inference engines that have no loader plugin seam (SGLang, FreeToken) can
# still stream weights concurrently via their built-in `--load-format
# runai_streamer`, which speaks S3 and nothing else.
#
# Depends on the fuser-FREE `core` layer of autumn-fuse — the same filesystem
# core the PyO3 `autumn.Fs` binding builds on, so lane striping, EN-direct
# reads and authz all come along for free.
[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
compio = { version = "0.18", features = ["macros", "net"] }
axum = "0.8"
cyper-axum = "0.8"
send_wrapper = { version = "0.6", features = ["futures"] }
futures = "0.3"
socket2 = { version = "0.5", features = ["all"] }
autumn-fuse = { path = "../../crates/fuse", default-features = false, features = ["core"] }
autumn-client = { path = "../../crates/client" }

[lints]
workspace = true
