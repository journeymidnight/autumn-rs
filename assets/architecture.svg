<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>autumn-rs architecture</title>
  <desc>Three ways in (a POSIX mount, an S3 endpoint, KV-cache adapters) over one partition layer and one stream layer, with the autumn-client SDK and the etcd-backed manager.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="430" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <g font-size="13" fill="#57606a" text-anchor="middle" font-weight="600">
    <text x="150" y="36">Files &amp; checkpoints</text>
    <text x="430" y="36">Model weights &amp; vector tables</text>
    <text x="710" y="36">Inference KV cache</text>
  </g>

  <g fill="#ffffff" stroke="#8c959f" stroke-width="1.2">
    <rect x="30" y="50" width="240" height="96" rx="10"/>
    <rect x="310" y="50" width="240" height="96" rx="10"/>
    <rect x="590" y="50" width="240" height="96" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#1f2328">
    <text x="150" y="80" font-size="16" font-weight="700">autumn-fuse</text>
    <text x="150" y="104" font-size="13">POSIX mount</text>
    <text x="150" y="124" font-size="13">autumn.Fs in Python</text>

    <text x="430" y="80" font-size="16" font-weight="700">autumn-s3</text>
    <text x="430" y="104" font-size="13">S3 endpoint</text>
    <text x="430" y="124" font-size="13">LanceDB · runai_streamer</text>

    <text x="710" y="80" font-size="16" font-weight="700">KV-cache adapters</text>
    <text x="710" y="104" font-size="13">LMCache L2 plugin (vLLM)</text>
    <text x="710" y="124" font-size="13">SGLang HiCache L3</text>
  </g>

  <g stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="150" y1="146" x2="150" y2="188"/>
    <line x1="430" y1="146" x2="430" y2="188"/>
    <line x1="710" y1="146" x2="710" y2="188"/>
  </g>

  <rect x="30" y="192" width="800" height="64" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/>
  <text x="430" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#0a3069">partition layer</text>
  <text x="430" y="241" text-anchor="middle" font-size="13" fill="#0a3069">ordered KV · LSM tree + value log · partition split / merge</text>

  <line x1="430" y1="256" x2="430" y2="272" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="30" y="276" width="800" height="64" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.2"/>
  <text x="430" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#116329">stream layer</text>
  <text x="430" y="325" text-anchor="middle" font-size="13" fill="#116329">replicated append-only extents · erasure coding · no local WAL</text>

  <rect x="30" y="360" width="390" height="46" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="225" y="388" text-anchor="middle" font-size="13" fill="#4d2d00"><tspan font-weight="700">autumn-client</tspan> · CLI · Rust · Python</text>
  <rect x="440" y="360" width="390" height="46" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="635" y="388" text-anchor="middle" font-size="13" fill="#4d2d00"><tspan font-weight="700">autumn-manager</tspan> · control plane on etcd</text>
</svg>
