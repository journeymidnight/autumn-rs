[package]
name = "autumn-object-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
autumn-client = { path = "../client" }
async-trait = "0.1"
bytes.workspace = true
chrono = { version = "0.4", features = ["serde"] }
compio = { workspace = true, features = ["time"] }
flume = "0.12"
futures = "0.3"
object_store = { version = "=0.14.1", default-features = false }
serde.workspace = true
serde_json = "1"
uuid.workspace = true

[dev-dependencies]
autumn-fuse = { path = "../fuse", default-features = false, features = ["core"] }
autumn-common = { path = "../common" }
autumn-etcd = { path = "../etcd" }
autumn-manager = { path = "../manager" }
autumn-partition-server = { path = "../partition-server" }
autumn-rpc = { path = "../rpc" }
autumn-stream = { path = "../stream" }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
object_store = { version = "=0.14.1", default-features = false, features = ["integration"] }

[lints]
workspace = true
