[package]
name = "autumn-transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
ucx = ["dep:ucx-sys-mini", "dep:socket2"]

[dependencies]
compio = { workspace = true, features = ["net", "io", "macros", "fs", "time"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
bytes.workspace = true
thiserror.workspace = true
libc = "0.2"
ucx-sys-mini = { path = "ucx-sys-mini", optional = true }
socket2 = { version = "0.5", optional = true, features = ["all"] }

[dev-dependencies]
rustix = { version = "1", features = ["net"] }
compio = { workspace = true, features = ["net", "io", "macros", "time", "bytes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bench]]
name = "transport_bench"
harness = false

[[bench]]
name = "compio_features"
harness = false

[lints]
workspace = true
