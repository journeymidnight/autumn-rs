[package]
name = "autumn-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "autumn-manager-server"
path = "src/bin/manager.rs"

[[bin]]
name = "autumn-extent-node"
path = "src/bin/extent_node.rs"

[[bin]]
name = "autumn-ps"
path = "src/bin/partition_server.rs"

[[bin]]
name = "autumn-client"
path = "src/bin/autumn_client.rs"

[[bin]]
name = "autumn-op"
path = "src/bin/autumn_op.rs"

[[bin]]
name = "autumnfs"
path = "src/bin/autumnfs.rs"

[dependencies]
# autumnfs reuses the ungated `key` + `schema` modules. `default-features = false`
# skips the fuser/libc/clap fuse-mount deps; we only need the bookkeeping
# structs + KV-key encoders, no kernel-side FUSE plumbing.
autumn-fuse = { path = "../fuse", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
autumn-common = { path = "../common" }
autumn-manager = { path = "../manager" }
autumn-stream = { path = "../stream" }
autumn-partition-server = { path = "../partition-server" }
autumn-rpc = { path = "../rpc" }
autumn-transport = { path = "../transport" }
autumn-client = { path = "../client" }
rkyv = { version = "0.8.15", features = ["alloc"] }
serde = { workspace = true }
serde_json = "1"
rand = "0.8"
uuid.workspace = true
libc = "0.2"
compio = { version = "0.18.0", features = ["macros", "time", "net"] }
futures = "0.3"
pprof = { version = "0.14", features = ["flamegraph"], optional = true }
# F193 allocator hygiene: tikv-jemallocator returns dirty pages to the
# OS within `dirty_decay_ms` (default 10 s in upstream jemalloc; we
# tune to 1 s via the MALLOC_CONF in the binary main.rs files).
# Without this, peak RSS observed during EC convert / copy_extent
# sits at the high-water mark indefinitely after the spike subsides
# because glibc's malloc doesn't aggressively MADV_FREE.
# Linux-only — falls back to default allocator on macOS dev boxes
# (the production target is Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"

[features]
default = []
profiling = ["dep:pprof"]
ucx = ["autumn-transport/ucx"]

[lints]
workspace = true
