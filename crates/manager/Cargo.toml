[package]
name = "autumn-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
autumn-common = { path = "../common" }
autumn-etcd = { path = "../etcd" }
autumn-rpc = { path = "../rpc" }
autumn-transport = { path = "../transport" }
bytes.workspace = true
compio = { version = "0.18", features = ["net", "time", "macros"] }
# F-AUTHZ-1: manager-as-KDC — Ed25519 signing (holds the private key) + SHA-256
# credential hashing for the tenant account DB.
ed25519-dalek = "2"
futures = "0.3"
rand = "0.8"
sha2 = "0.10"
rkyv = { version = "0.8.15", features = ["alloc"] }
# F-DASH-IN-MGR: embedded web dashboard. Same HTTP stack as `examples/gallery`
# (axum over the compio-native cyper-axum server; send_wrapper bridges axum's
# Send bound over the !Send manager state — safe on the single-threaded compio
# runtime). serde_json is confined to the dashboard's browser-facing JSON,
# never the rkyv RPC codec.
axum = "0.8"
cyper-axum = "0.8"
send_wrapper = { version = "0.6", features = ["futures"] }
serde_json = "1"
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
autumn-stream = { path = "../stream" }
autumn-partition-server = { path = "../partition-server" }
autumn-client = { path = "../client" }
autumn-rpc = { path = "../rpc" }
autumn-etcd = { path = "../etcd" }
# F244-B: fuse read-path e2e (system_fuse_read.rs) — needs the fuse modules
# (FsState / read / meta / dispatch), behind the `fuse` feature.
autumn-fuse = { path = "../fuse", features = ["fuse"] }
compio = { version = "0.18", features = ["net", "time", "macros"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
crc32c = "0.6"

[lints]
workspace = true
