[package]
name = "autumn-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
autumn-common = { path = "../common" }
autumn-etcd = { path = "../etcd" }
autumn-rpc = { path = "../rpc" }
autumn-transport = { path = "../transport" }
bytes.workspace = true
compio = { version = "0.18", features = ["net", "time", "macros"] }
futures = "0.3"
rand = "0.8"
rkyv = { version = "0.8.15", features = ["alloc"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
autumn-stream = { path = "../stream" }
autumn-partition-server = { path = "../partition-server" }
autumn-client = { path = "../client" }
autumn-rpc = { path = "../rpc" }
autumn-etcd = { path = "../etcd" }
# F244-B: fuse read-path e2e (system_fuse_read.rs) — needs the fuse modules
# (FsState / read / meta / dispatch), behind the `fuse` feature.
autumn-fuse = { path = "../fuse", features = ["fuse"] }
# F248: io_uring daemon fuse-file read path e2e (system_ioring_fuse.rs) — needs
# the daemon-side `fuse_read` module (path resolve + extent read), behind `daemon`.
autumn-ioring = { path = "../ioring", features = ["daemon"] }
compio = { version = "0.18", features = ["net", "time", "macros"] }
tempfile = "3"
tracing-subscriber = "0.3"
anyhow = "1"
crc32c = "0.6"

[lints]
workspace = true
