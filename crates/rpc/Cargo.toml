[package]
name = "autumn-rpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Propagate the UCX transport down to autumn-transport. Off by default
# (TCP); enable with `--features ucx` to compile in UcxTransport.
ucx = ["autumn-transport/ucx"]

[dependencies]
autumn-transport = { path = "../transport" }
bytes.workspace = true
compio = { version = "0.18", features = ["net", "time", "macros"] }
crc32c.workspace = true
# Data-plane authz (F-AUTHZ-1): Ed25519 capability-token codec. The manager
# signs (holds private key), PS verifies (holds only public key). This crate
# is the shared wire+crypto home so signer and verifier never drift.
ed25519-dalek = "2"
rkyv = { version = "0.8.15", features = ["alloc"] }
# rkyv's own `alloc` does NOT reach rancor's, and rancor is what carries the
# TEXT of a validation failure. Without this a decode error is literally
# "failed without error information; enable debug assertions and the `alloc`
# feature in rancor" — which is what an operator saw while a 130 GiB weight
# load stalled, with nothing in the PS or EN logs either. Direct dep purely so
# cargo's feature unification turns it on for the whole graph.
rancor = { version = "0.1", features = ["alloc"] }
thiserror.workspace = true
futures = "0.3"
tracing = "0.1"

# Build-only: the wire fingerprint parses these schema files instead of hashing
# their bytes, so prose edits stop moving it. See build.rs.
[build-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "printing"] }

[dev-dependencies]
libc = "0.2"

[[bench]]
name = "ps_read_bench"
harness = false

[lints]
workspace = true
