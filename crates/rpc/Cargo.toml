[package]
name = "autumn-rpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Propagate the UCX transport down to autumn-transport. Off by default
# (TCP); enable with `--features ucx` to compile in UcxTransport.
ucx = ["autumn-transport/ucx"]

[dependencies]
autumn-transport = { path = "../transport" }
bytes.workspace = true
compio = { version = "0.18", features = ["net", "time", "macros"] }
crc32c.workspace = true
# Data-plane authz (F-AUTHZ-1): Ed25519 capability-token codec. The manager
# signs (holds private key), PS verifies (holds only public key). This crate
# is the shared wire+crypto home so signer and verifier never drift.
ed25519-dalek = "2"
rkyv = { version = "0.8.15", features = ["alloc"] }
thiserror.workspace = true
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
libc = "0.2"

[[bench]]
name = "ps_read_bench"
harness = false

[lints]
workspace = true
