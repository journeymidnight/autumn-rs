[package]
name = "autumn-ioring"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "autumn_ioring"

[[bin]]
name = "autumn-ioring-daemon"
path = "src/bin/daemon.rs"
required-features = ["daemon"]

[[bin]]
name = "autumn-ioring-bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

[features]
default = []
# `daemon` pulls in the autumn-client + compio runtime dependencies
# needed to actually service SQEs against an autumn-rs cluster. The
# core protocol crate (`lib`) builds without these deps so it can be
# linked into a Python pyo3 binding (F180-D) without the heavy
# transitive compio chain.
daemon = ["dep:autumn-client", "dep:autumn-rpc", "dep:autumn-fuse", "dep:autumn-transport", "dep:compio", "dep:futures", "dep:anyhow", "dep:tracing-subscriber", "dep:clap", "dep:uuid"]
# F243: build the daemon with UCX so it can `--transport ucx` AND `ucp_mem_map`-
# register the ring region for RDMA zero-copy reads INTO the ring. Needs the ucx
# feature all the way down (transport → rpc → client). On a non-UCX build the
# daemon still runs (TCP, ring registration is a no-op / None).
ucx = ["daemon", "autumn-client/ucx", "autumn-transport/ucx"]
# `bench` is the read-throughput harness. Lighter dep set (no compio,
# no autumn-client) — uses std threads + the IoRingClient API.
bench = ["dep:clap", "dep:anyhow", "dep:tracing-subscriber"]

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
libc = "0.2"

# Optional — only pulled in when the `daemon` feature is on.
autumn-client = { path = "../client", optional = true }
autumn-rpc = { path = "../rpc", optional = true }
# F248: the daemon resolves fuse files (inode + variable-length extents) using
# autumn-fuse's UNGATED `key` + `schema` modules. `default-features = false`
# excludes the heavy `fuse` feature (fuser/compio mount layer) — we only need
# the key encoding + rkyv schema decoders.
autumn-fuse = { path = "../fuse", optional = true, default-features = false }
# F243: transport init (--transport tcp|ucx) + `register_memory` (ucp_mem_map of
# the ring region). The `ucx` feature flows through to enable RDMA.
autumn-transport = { path = "../transport", optional = true }
compio = { version = "0.18", features = ["net", "io", "macros", "time", "fs"], optional = true }
futures = { version = "0.3", optional = true }
anyhow = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
# F-ioring-lease-2: ClientId UUID for the inode-lease handshake.
uuid = { workspace = true, optional = true }

[lints]
workspace = true
