[package]
name = "autumn-fuse"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "autumn-fuse"
path = "src/main.rs"
required-features = ["fuse"]

[features]
default = ["fuse"]
# F-FS-UNIFY M1: the fuser-FREE filesystem core (meta/dir/extent/read/
# write/state over ClusterClient). libc is the only extra dep (getuid/
# getgid + the S_IF* mode-bit constants). This is what the PyO3
# `autumn.Fs` binding (M2) links against — no kernel-mount machinery.
core = ["dep:libc"]
fuse = ["core", "dep:fuser", "dep:clap", "dep:crossbeam-channel", "dep:futures", "dep:compio", "dep:rand", "dep:tracing-subscriber"]
# Build the mount binary with UCX so `--transport ucx` works against a UCX cluster.
ucx = ["autumn-transport/ucx", "autumn-client/ucx"]

[dependencies]
autumn-rpc = { path = "../rpc" }
autumn-client = { path = "../client" }
autumn-transport = { path = "../transport" }

anyhow.workspace = true
bytes.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

rkyv = { version = "0.8", features = ["alloc"] }
# F-fuse-lease-2: `abi-7-12` unlocks `Notifier::inval_inode` /
# `inval_entry` — required so the per-mount invalidation poll loop
# can drop the kernel's attribute + page cache on per-ino
# `WriterClosed` events. Brings the close-to-open coherence
# guarantee all the way through to the kernel boundary.
fuser = { version = "0.15", optional = true, features = ["abi-7-12"] }
libc = { version = "0.2", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
futures = { version = "0.3", optional = true }
compio = { version = "0.18", features = ["runtime", "time", "io", "net"], optional = true }
rand = { version = "0.8", optional = true }
