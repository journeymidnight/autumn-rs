[package]
name = "autumn-fuse"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "autumn-fuse"
path = "src/main.rs"
required-features = ["fuse"]

[features]
default = ["fuse"]
# F-FS-UNIFY M1/M4: the fuser-FREE filesystem core (meta/dir/extent/read/
# write/state over ClusterClient). libc for getuid/getgid + S_IF* mode bits;
# compio for the M4 `lease_tasks` background heartbeat/poll (the core already
# runs on a compio runtime via ClusterClient — the binding + fuse mount both
# provide one). Still no kernel-mount machinery (fuser/clap/crossbeam).
core = ["dep:libc", "dep:compio"]
fuse = ["core", "dep:fuser", "dep:clap", "dep:crossbeam-channel", "dep:futures", "dep:compio", "dep:rand", "dep:tracing-subscriber"]
# Build the mount binary with UCX so `--transport ucx` works against a UCX cluster.
ucx = ["autumn-transport/ucx", "autumn-client/ucx"]

[dependencies]
autumn-rpc = { path = "../rpc" }
autumn-client = { path = "../client" }
autumn-transport = { path = "../transport" }

anyhow.workspace = true
bytes.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

rkyv = { version = "0.8", features = ["alloc"] }
# Two floors, both load-bearing:
#   abi-7-12 — `Notifier::inval_inode` / `inval_entry`, so the per-mount
#     invalidation poll loop can drop the kernel's attribute + page cache on a
#     per-ino `WriterClosed` event. That is what carries close-to-open
#     coherence all the way to the kernel boundary.
#   abi-7-28 — `FUSE_MAX_PAGES` and the INIT reply's `max_pages` field, both of
#     which are `#[cfg]`-compiled-out below it. Without them the kernel clamps
#     EVERY request to its 32-page default of 128 KiB, which made
#     `set_max_write` in `ops.rs::init` inert and cost the read path 45%
#     (898 -> 1621 MiB/s on a 4 GiB file when it was enabled).
# Raising this floor makes new opcodes reachable: check what lands on a method
# we already implement, not just what gets ENOSYS. `FUSE_RENAME2` is the one
# that did — see the flags guard in `ops.rs::rename`.
fuser = { version = "0.15", optional = true, features = ["abi-7-28"] }
libc = { version = "0.2", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
futures = { version = "0.3", optional = true }
compio = { version = "0.18", features = ["runtime", "time", "io", "net"], optional = true }
rand = { version = "0.8", optional = true }
