# One-shot: fetch nvidia/MiniMax-M2.5-NVFP4 from HF and load it into autumn fs/.
#
# Not part of the overlay's resources — it is an operator action, run once per
# model, and a Job's pod template is immutable so re-running means deleting it
# first. Fill IMAGE_FREETOKEN with the same commit tag the serving pod uses.
#
#   kubectl -n autumn delete job upload-model-minimax --ignore-not-found
#   kubectl -n autumn apply -f deploy/overlays/vke/upload-model-minimax.yaml
#   kubectl -n autumn logs -f job/upload-model-minimax
#
# ⚠️ PRESPLIT FIRST. Cutting a partition that already holds data mostly fails on
# `has_overlap` (CoW out-of-range keys), and the recovery is delete + major
# compact + retry. `fs` is already presplit to 6 partitions across 3 PS; if you
# want a different shape, change it BEFORE running this.
#
# Uses the freetoken image because it is the only one carrying both halves:
# python/pip for the HF download, and autumnfs for the upload.
apiVersion: batch/v1
kind: Job
metadata:
  name: upload-model-minimax
  namespace: autumn
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      # Any autumn-capable node. Not the GPU node: this needs no GPU, and
      # pinning it there would compete with serving for page cache and disk.
      nodeSelector: { autumn-node: "true" }
      containers:
        - name: upload
          image: IMAGE_FREETOKEN
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              REPO=nvidia/MiniMax-M2.5-NVFP4
              DEST=models/minimax-m25
              M="$(getent hosts autumn-manager | awk '{print $1}'):9001"
              CRED=/etc/autumn/cred/fs.cred
              AF="autumnfs --manager $M --credential-file $CRED"
              echo "manager=$M  repo=$REPO  dest=$DEST"

              python3 -m pip install --no-cache-dir -q "huggingface_hub[cli]"

              # hf-mirror serves the weights; the direct endpoint is unusable
              # from these nodes. --max-workers is the download parallelism.
              export HF_ENDPOINT=https://hf-mirror.com
              echo ">>> downloading (~130 GiB, resumable)"
              hf download "$REPO" --local-dir /scratch/model --max-workers 8

              echo ">>> uploading to autumn fs/$DEST"
              $AF mkdir models 2>/dev/null || true
              $AF mkdir "$DEST" 2>/dev/null || true

              cd /scratch/model
              n=0; total=$(find . -type f | wc -l)
              # autumnfs put takes ONE file; there is no recursive form. Files
              # land striped across the 24 declared lanes automatically, so this
              # loop still spreads across partitions even though it is serial.
              find . -type f | sed 's|^\./||' | sort | while read -r f; do
                n=$((n+1))
                case "$f" in */*) $AF mkdir "$DEST/${f%/*}" 2>/dev/null || true ;; esac
                printf '[%d/%d] %s ' "$n" "$total" "$f"
                $AF put "$f" "$DEST/$f" >/dev/null
                echo ok
              done

              echo ">>> verifying"
              $AF ls "$DEST" | head -20
              echo ">>> local vs cluster file count"
              echo "local:   $(find /scratch/model -type f | wc -l)"
              echo "cluster: $($AF ls "$DEST" | wc -l)  (top level only)"
              echo ">>> done"
          env:
            - { name: HF_HUB_ENABLE_HF_TRANSFER, value: "0" }
            - { name: PIP_INDEX_URL, value: "https://mirrors.ivolces.com/pypi/simple/" }
          volumeMounts:
            - { name: scratch, mountPath: /scratch }
            - { name: cred, mountPath: /etc/autumn/cred, readOnly: true }
          resources:
            requests: { cpu: "4", memory: 8Gi }
            limits:   { cpu: "8", memory: 16Gi }
      volumes:
        # 130 GiB of checkpoint plus room to spare. emptyDir lands on the node's
        # ephemeral storage, which the autumn-node pool has (~970 GB allocatable
        # on the GPU node; check the target node before raising this).
        - { name: scratch, emptyDir: { sizeLimit: 200Gi } }
        - name: cred
          secret: { secretName: autumn-credential }
