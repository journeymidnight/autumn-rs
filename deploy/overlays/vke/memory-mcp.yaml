# ⚠️ NOT in kustomization.yaml yet — IMAGE_AUTUMN_RS needs the current commit tag.
#
# memory-mcp over the documents stored in autumn.
#
# The two namespaces play different roles here and it is worth being explicit:
# the DOCUMENTS live in `fs/` and are read through a FUSE mount, because
# memory-mcp ingests from a filesystem path (`--docs`, and the MCP
# `ingest_documents` tool takes a server-side path, not content). The INDEX it
# builds — BM25 postings, IVF vectors, the CONTAINS outline graph — is written
# to `mem/`. So this pod reads fs/ and writes mem/, and needs a credential for
# each.
#
# Corpus: `fs/docs/buda/` (17 Chinese Buddhist texts, ~2.1M chars, 5164 chunks
# when ingested locally). `--no-index` skips the Rust source indexer — there is
# no code tree in this pod and the docs corpus is the whole point.
---
apiVersion: v1
kind: Service
metadata:
  name: memory-mcp
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: memory-mcp }
spec:
  # ClusterIP: the HTTP surface is read-only but unauthenticated, same posture
  # as the dashboard. Reach it with `kubectl port-forward`.
  type: ClusterIP
  selector: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: memory-mcp }
  ports:
    - { name: http, port: 5100, targetPort: 5100 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-mcp
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: memory-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: memory-mcp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: memory-mcp }
    spec:
      enableServiceLinks: false
      nodeSelector: { autumn-node: "true" }

      # Native sidecar so the mount is up before ingest starts. A plain sidecar
      # would race it, and memory-mcp reads --docs eagerly at startup.
      initContainers:
        - name: fuse
          image: IMAGE_AUTUMN_RS
          restartPolicy: Always
          args: ["fuse"]
          env:
            - { name: AUTUMN_MANAGER,         value: "autumn-manager:9001" }
            - { name: AUTUMN_FUSE_MOUNTPOINT, value: "/mnt/autumn" }
            - { name: AUTUMN_CREDENTIAL_FILE, value: "/etc/autumn/cred/fs.cred" }
          securityContext: { privileged: true }
          volumeMounts:
            - { name: mnt, mountPath: /mnt/autumn, mountPropagation: Bidirectional }
            - { name: cred, mountPath: /etc/autumn/cred, readOnly: true }
          startupProbe:
            exec: { command: ["sh", "-c", "mountpoint -q /mnt/autumn"] }
            periodSeconds: 3
            failureThreshold: 40

      containers:
        - name: memory-mcp
          image: IMAGE_AUTUMN_RS
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              # IP-only client: resolve the manager before dialing it.
              M="$(getent hosts autumn-manager | awk '{print $1}'):9001"
              echo "manager=$M  corpus=/mnt/autumn/docs/buda"
              ls /mnt/autumn/docs/buda | head -5
              exec memory-mcp "$M" \
                --no-index \
                --docs /mnt/autumn/docs/buda \
                --tenant buda \
                --credential-file /etc/autumn/cred/mem.cred \
                --host 0.0.0.0 --port 5100
          ports:
            - { name: http, containerPort: 5100 }
          volumeMounts:
            - { name: mnt, mountPath: /mnt/autumn, readOnly: true, mountPropagation: HostToContainer }
            - { name: cred, mountPath: /etc/autumn/cred, readOnly: true }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits:   { cpu: "4", memory: 8Gi }
          startupProbe:
            # Ingest of this corpus took ~3m20s against a local 3-node cluster;
            # the HTTP listener only comes up after it finishes.
            httpGet: { path: /stats, port: 5100 }
            periodSeconds: 10
            failureThreshold: 60      # 10 min
          readinessProbe:
            httpGet: { path: /stats, port: 5100 }
            periodSeconds: 15

      volumes:
        - { name: mnt, emptyDir: {} }
        - name: cred
          secret: { secretName: autumn-credential }
