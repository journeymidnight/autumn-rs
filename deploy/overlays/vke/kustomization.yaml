# VKE (Volcengine) overlay — cluster-specific values layered on the generic base.
#
#   kubectl apply -k deploy/overlays/vke
#
# Everything here differs per cluster and therefore does NOT belong in the base:
#   - image ref (your registry/tag) + registry mirror for etcd
#   - node pinning (this cluster's kernel-5.15 node pool, labeled autumn-node=true)
#   - StorageClass name + min size for etcd (Volcengine EBS ESSD)
#   - EN replica count / AUTUMN_EXPECT_NODES sizing (5 here vs the base default 3)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s                  # the generic base (deploy/k8s)
  - en-extra-services.yaml     # per-pod Services for EN ordinals 3 and 4

images:
  - name: autumn-rs
    newName: dongmao-test-cn-beijing.cr.volces.com/dongmao-test/autumn-rs
    newTag: 82d759c6fb1f3559d1d48ea3454ae4c2dfb2f8ad
  # This cluster's nodes reach the daocloud mirror, not quay.io directly.
  - name: quay.io/coreos/etcd
    newName: quay.m.daocloud.io/coreos/etcd
    newTag: v3.5.11

patches:
  # Pin all autumn workloads to the 5 kernel-5.15 Ubuntu nodes (autumn-node=true),
  # keeping them off this cluster's remaining kernel-5.4 veLinux nodes (where
  # compio's io_uring would need a memlock/IPC_LOCK workaround).
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          autumn-node: "true"
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          autumn-node: "true"
  # Scale to 5 extent nodes (base ships 3). Must keep AUTUMN_EXPECT_NODES in step.
  - target:
      kind: StatefulSet
      name: autumn-en
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
      # 4 shards want ~4 io_uring cores; request them so the scheduler reserves
      # room (no limit — the EN can still burst on its 12-core node).
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "4"
  # Run 3 partition servers so the 8 presplit partitions fan out across 3 PS
  # processes on 3 nodes (base ships 1 PS → all 8 partitions on one process,
  # ~16 partition threads oversubscribing one 12-core node → write tail under
  # load). rebalance_regions only spreads partitions that exist BEFORE their
  # PS is assigned, so the 3 PS must be up at bootstrap — a fresh deploy does
  # that. Anti-affinity spreads the 3 PS onto distinct nodes.
  - target:
      kind: StatefulSet
      name: autumn-ps
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      # Parallel so all 3 PS start + register together (~15s), before the ENs
      # finish coming Online (~60s) and bootstrap creates the 8 partitions —
      # otherwise OrderedReady brings PS up one at a time and only ps-0 is
      # registered at bootstrap, so all 8 partitions land on it.
      - op: add
        path: /spec/podManagementPolicy
        value: Parallel
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/component: partition-server
  - target:
      kind: ConfigMap
      name: autumn-config
    patch: |-
      - op: replace
        path: /data/AUTUMN_EXPECT_NODES
        value: "5"
      # Presplit at bootstrap so writes fan out across N group-commit pipelines
      # instead of serializing on one. Benchmarked (write, 4K, RF=3 on NVMe,
      # single-shard EN): p1 7.7k → p8 35k → p16 59k → p32 65k ops/s — the write
      # ceiling flattens past ~16 as a single EN io_uring core saturates.
      - op: add
        path: /data/AUTUMN_BOOTSTRAP_PRESPLIT
        value: "32"
      # Multi-shard extent nodes: 4 io_uring cores per EN (shard = extent_id % 4)
      # instead of one, to push past the single-EN-core write ceiling. REQUIRES
      # the per-pod EN Services to expose every shard's data+control port (patch
      # below) and the entrypoint's AUTUMN_EXTENT_SHARDS→--shard-ports wiring
      # (deploy/docker/entrypoint.sh). NEEDS a rebuilt image (entrypoint change).
      - op: add
        path: /data/AUTUMN_EXTENT_SHARDS
        value: "4"
  # etcd wants network-durable storage. The base omits storageClassName to inherit
  # the cluster default, but this cluster marks no default — name Volcengine's EBS
  # class explicitly. EBS ESSD has a 20Gi minimum (base 1Gi → InvalidVolumeSize).
  - target:
      kind: StatefulSet
      name: autumn-etcd
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: ebs-ssd
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi
  # Multi-shard EN: each per-pod Service (autumn-en-0..4) must expose EVERY
  # shard's data port (9101 + i*10) and control port (10101 + i*10) for i in
  # 0..3, or the manager/PS can't reach shards 1-3. Name is a regex so this one
  # patch hits all five per-pod Services but NOT the headless `autumn-en`.
  - target:
      kind: Service
      name: "^autumn-en-[0-9]+$"
    patch: |-
      - op: replace
        path: /spec/ports
        value:
          - { name: data-0, port: 9101,  targetPort: 9101 }
          - { name: data-1, port: 9111,  targetPort: 9111 }
          - { name: data-2, port: 9121,  targetPort: 9121 }
          - { name: data-3, port: 9131,  targetPort: 9131 }
          - { name: ctrl-0, port: 10101, targetPort: 10101 }
          - { name: ctrl-1, port: 10111, targetPort: 10111 }
          - { name: ctrl-2, port: 10121, targetPort: 10121 }
          - { name: ctrl-3, port: 10131, targetPort: 10131 }
