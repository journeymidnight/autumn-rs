# Extra per-pod ClusterIP Services for extent-node ordinals 3 and 4 (this overlay
# runs 5 ENs; the generic base ships 3). Each EN advertises its own stable
# per-pod Service ClusterIP, so every ordinal needs one. See extent-node.yaml.
apiVersion: v1
kind: Service
metadata:
  name: autumn-en-3
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
    statefulset.kubernetes.io/pod-name: autumn-en-3
  ports:
    - { name: data, port: 9101, targetPort: 9101 }
    - { name: control, port: 10101, targetPort: 10101 }
---
apiVersion: v1
kind: Service
metadata:
  name: autumn-en-4
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
    statefulset.kubernetes.io/pod-name: autumn-en-4
  ports:
    - { name: data, port: 9101, targetPort: 9101 }
    - { name: control, port: 10101, targetPort: 10101 }
