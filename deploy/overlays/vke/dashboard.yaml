# examples/dashboard as a standalone in-cluster app.
#
# The manager NO LONGER serves the dashboard. This small Deployment runs the
# `autumn-dashboard` binary (same image), which holds no cluster state and drives
# the cluster ONLY through `autumn-op` — the wire schema stays in one place. It
# talks to the manager Service (`autumn-manager`, leader-gated) and is gated on
# the admin token from the `autumn-authz` Secret (created once by deploy.sh).
#
# ClusterIP only — reachable in-cluster / via `kubectl port-forward svc/autumn-
# dashboard 8799`, NEVER from the internet (no NodePort/LoadBalancer). The admin
# token gates mutations; there is no per-request auth on the port itself, so pair
# exposure with network ACLs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autumn-dashboard
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autumn
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autumn
        app.kubernetes.io/component: dashboard
    spec:
      # This overlay's node pool (the vke kustomization pins StatefulSets/Jobs the
      # same way; a Deployment isn't covered by those patches, so pin it here).
      nodeSelector:
        autumn-node: "true"
      containers:
        - name: dashboard
          image: autumn-rs:latest
          # Run the binary directly (bypass the entrypoint role dispatcher, like
          # the bootstrap Job). Flags, not env — this app takes no AUTUMN_* env.
          #
          # Through a shell, and only to resolve the manager: autumn's Rust
          # client dials an IP literal and does NOT resolve names, so passing
          # `autumn-manager:9001` starts the process cleanly and then answers
          # every query with nothing — 0 partitions, 0 servers, no error in the
          # log. Same convention as the other roles' startup scripts.
          command: ["/bin/sh", "-c"]
          args:
            - exec autumn-dashboard
              --manager "$(getent hosts autumn-manager | awk '{print $1}'):9001"
              --admin-token-file /etc/autumn/authz/admin.token
              --listen 0.0.0.0 --port 8799
          ports:
            - { name: dashboard, containerPort: 8799 }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
          volumeMounts:
            - name: authz
              mountPath: /etc/autumn/authz
              readOnly: true
      volumes:
        # REQUIRED (not optional): the dashboard is token-gated, so no Secret =
        # no dashboard. deploy.sh provisions autumn-authz once before apply.
        - name: authz
          secret:
            secretName: autumn-authz
---
apiVersion: v1
kind: Service
metadata:
  name: autumn-dashboard
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: dashboard
  ports:
    - { name: dashboard, port: 8799, targetPort: 8799 }
---
# The dashboard, published through the cluster's APIG. All of it.
#
# This routes every path, including the mutating ones — `/api/action` (split,
# merge) and `/api/policies/{activate,upsert,delete}` — because operating the
# cluster from the dashboard is the point of having it. That was an explicit
# call, made after the alternative was tried: routing only the read paths left
# every button in the UI answering 404, which reads as a broken dashboard
# rather than as a policy.
#
# What that means, stated plainly so nobody has to rediscover it: this is a
# browsable public HTTPS URL with NO authentication, and `autumn-dashboard`
# runs with `--admin-token-file` and shells out to `autumn-op`. Anyone with the
# URL can split and merge partitions and flip the auto-policy switches, and can
# read the cluster's topology. The dashboard has no auth of its own — unlike
# `hermes-webui`, which does its own basic auth from a Secret. Adding the same
# there is what would close this; a shorter path list only made the tool
# useless without making the URL private.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autumn-dashboard-apig
  annotations:
    ingress.vke.volcengine.com/apig-instance-name: gda7u922gbfvc539oufjg-apig-instance
    ingress.vke.volcengine.com/loadbalancer-id: gda7u922gbfvc539oufjg
spec:
  ingressClassName: physicalai-apig
  rules:
    - host: autumn-dashboard.apig.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: autumn-dashboard
                port:
                  number: 8799
