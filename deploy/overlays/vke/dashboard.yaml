# examples/dashboard as a standalone in-cluster app.
#
# The manager NO LONGER serves the dashboard. This small Deployment runs the
# `autumn-dashboard` binary (same image), which holds no cluster state and drives
# the cluster ONLY through `autumn-op` — the wire schema stays in one place. It
# talks to the manager Service (`autumn-manager`, leader-gated) and is gated on
# the admin token from the `autumn-authz` Secret (created once by deploy.sh).
#
# ClusterIP only — reachable in-cluster / via `kubectl port-forward svc/autumn-
# dashboard 8799`, NEVER from the internet (no NodePort/LoadBalancer). The admin
# token gates mutations; there is no per-request auth on the port itself, so pair
# exposure with network ACLs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autumn-dashboard
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autumn
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autumn
        app.kubernetes.io/component: dashboard
    spec:
      # This overlay's node pool (the vke kustomization pins StatefulSets/Jobs the
      # same way; a Deployment isn't covered by those patches, so pin it here).
      nodeSelector:
        autumn-node: "true"
      containers:
        - name: dashboard
          image: autumn-rs:latest
          # Run the binary directly (bypass the entrypoint role dispatcher, like
          # the bootstrap Job). Flags, not env — this app takes no AUTUMN_* env.
          command:
            - autumn-dashboard
            - --manager
            - autumn-manager:9001
            - --admin-token-file
            - /etc/autumn/authz/admin.token
            - --listen
            - 0.0.0.0
            - --port
            - "8799"
          ports:
            - { name: dashboard, containerPort: 8799 }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
          volumeMounts:
            - name: authz
              mountPath: /etc/autumn/authz
              readOnly: true
      volumes:
        # REQUIRED (not optional): the dashboard is token-gated, so no Secret =
        # no dashboard. deploy.sh provisions autumn-authz once before apply.
        - name: authz
          secret:
            secretName: autumn-authz
---
apiVersion: v1
kind: Service
metadata:
  name: autumn-dashboard
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: dashboard
  ports:
    - { name: dashboard, port: 8799, targetPort: 8799 }
---
# Public read-only view of the dashboard, through the cluster's APIG.
#
# ONLY the read paths are routed, and that is the whole security story here.
# `autumn-dashboard` runs with `--admin-token-file` and shells out to
# `autumn-op`, so `/api/action` splits and merges partitions and
# `/api/policies/{activate,upsert,delete}` flips the auto-policy switches — with
# no authentication of its own, unlike the webui, which does its own basic auth
# from a Secret. Publishing a catch-all `/` prefix would hand those to anyone
# who found the URL.
#
# So the paths are enumerated instead, and `/api/policies` is `Exact` on
# purpose: as a `Prefix` it would also match `/api/policies/activate`. Anything
# not listed has no backend at the gateway and 404s there, which is why the
# mutating buttons in the UI do not work through this host. They still work from
# inside the cluster (`kubectl port-forward svc/autumn-dashboard 8799`).
#
# What this DOES expose to anyone with the URL: cluster topology — node
# addresses, partition layout, sizes, op history. If that is too much, the fix
# is basic auth in the dashboard itself, the way the webui has it, not a
# narrower path list.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autumn-dashboard-apig
  annotations:
    ingress.vke.volcengine.com/apig-instance-name: gda7u922gbfvc539oufjg-apig-instance
    ingress.vke.volcengine.com/loadbalancer-id: gda7u922gbfvc539oufjg
spec:
  ingressClassName: physicalai-apig
  rules:
    - host: autumn-dashboard.apig.local
      http:
        paths:
          - { path: /,               pathType: Exact,  backend: { service: { name: autumn-dashboard, port: { number: 8799 } } } }
          - { path: /api/overview,   pathType: Exact,  backend: { service: { name: autumn-dashboard, port: { number: 8799 } } } }
          - { path: /api/ops,        pathType: Exact,  backend: { service: { name: autumn-dashboard, port: { number: 8799 } } } }
          - { path: /api/policies,   pathType: Exact,  backend: { service: { name: autumn-dashboard, port: { number: 8799 } } } }
          - { path: /api/partition/, pathType: Prefix, backend: { service: { name: autumn-dashboard, port: { number: 8799 } } } }
