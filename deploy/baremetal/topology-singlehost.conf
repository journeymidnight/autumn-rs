# ============================================================
# autumn-rs single-host topology  (dev / laptop — replaces start.sh)
# ============================================================
#
# Everything on 127.0.0.1: 1 etcd + 1 manager + 3 extent-nodes (distinct data
# dirs + ports) + 1 partition server. No SSH, no systemd needed — on a host
# without systemd (macOS, containers) autumn-deploy uses its process backend
# (backgrounded process + pidfile), the same semantics start.sh had.
#
#   ./autumn-deploy -t topology-singlehost.conf start
#   ./autumn-deploy -t topology-singlehost.conf status
#   ./autumn-deploy -t topology-singlehost.conf stop           # keep data
#   ./autumn-deploy -t topology-singlehost.conf destroy --wipe # stop + wipe
#
# Adjust EN_NODES data dirs to match your local disks. On a laptop, a single
# temp-dir EN is enough:  EN_NODES=("127.0.0.1|/tmp/autumn/en0")

DEPLOY_DIR="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")/../.." && pwd)"  # repo root
DATA_ROOT=/tmp/autumn-rs
TRANSPORT=tcp
SERVICE_BACKEND=process        # force process backend for single-host dev
SSH_USER="$(id -un)"
SSH_OPTS=""

ETCD_HOSTS=(127.0.0.1)

MANAGER_HOSTS=(127.0.0.1)
MANAGER_PORT=9001

# 3 ENs on the loopback, each on its own port + data dir (RF=3 capable).
EN_BASE_PORT=9101
EN_NODES=(
  "127.0.0.1|/tmp/autumn-rs/en0"
  "127.0.0.1|/tmp/autumn-rs/en1"
  "127.0.0.1|/tmp/autumn-rs/en2"
)

PS_HOSTS=(127.0.0.1)
PS_BASE_PORT=9301
PS_PORT_STRIDE=200

# 3 ENs → replication 3+0, no EC (need >=4 nodes for parity headroom).
REPLICATION=""
EC_LOG=""
EC_ROW=""
PRESPLIT=""
