# ============================================================
# autumn-rs cluster topology  (multi-host production example)
# ============================================================
#
# Sourced verbatim by ./autumn-deploy — it is a bash file, so keep it valid
# bash (arrays, no spaces around `=`). Copy it, edit the hosts/disks, then:
#
#   ./autumn-deploy -t my-topology.conf check     # validate topology + reachability
#   ./autumn-deploy -t my-topology.conf deploy    # push binaries + render services
#   ./autumn-deploy -t my-topology.conf start      # bring the cluster up (ordered)
#   ./autumn-deploy -t my-topology.conf status
#   ./autumn-deploy -t my-topology.conf stop
#
# For a single machine (dev / laptop) use topology-singlehost.conf instead — it
# replaces the old start.sh / stop.sh.
#
# ADDRESSING RULE (hard constraint from the binaries): every host below must be
# an IP LITERAL (v4 or v6), NOT a DNS name. The autumn-rs binaries parse every
# address with SocketAddr::parse and never resolve names. autumn-deploy itself
# resolves a name once (for SSH), but what it bakes into --advertise / --manager
# must be an IP. Bracket bare IPv6 is handled for you.

# ---- global ----------------------------------------------------------------
DEPLOY_DIR=/opt/autumn-rs                # binaries + rendered units land here
DATA_ROOT=/var/lib/autumn-rs             # etcd data, PS local state, logs, pids
TRANSPORT=tcp                            # tcp | ucx  (ucx needs an RDMA host + a
                                         # ucx-enabled build; v1 images are tcp)
SERVICE_BACKEND=auto                     # auto | systemd | process
                                         #   auto → systemd on a systemd host with
                                         #   root/sudo, else a backgrounded process
                                         #   (pidfile) — the macOS / container path.
SSH_USER=root                            # user for remote hosts (ignored for local)
SSH_OPTS=""                              # extra ssh flags, e.g. "-i /path/key -p 22"

# ---- etcd ------------------------------------------------------------------
# Each entry = one etcd member. Member m: client port 2379+m*10, peer 2380+m*10.
# 1 member is fine for dev; use 3 for a fault-tolerant control plane.
ETCD_HOSTS=(10.0.0.1)

# ---- manager ---------------------------------------------------------------
# Each entry = one manager process (all share the etcd cluster; >1 = HA via etcd
# leader election). PS + clients receive the FULL manager list and rotate on
# NOT_LEADER (the only failover path — the protocol carries no leader hint).
MANAGER_HOSTS=(10.0.0.1)
MANAGER_PORT=9001

# ---- extent nodes ----------------------------------------------------------
# Each entry = one extent-node instance:  "HOST|DATADIR[,DATADIR2,...]"
# Multiple data dirs on one host = a multi-disk EN. Instance i binds
# EN_BASE_PORT+i and advertises HOST:port (identity is keyed on this address and
# is never re-registered on restart, so HOST must be a stable IP).
EN_BASE_PORT=9101
EN_NODES=(
  "10.0.0.4|/data03/autumn"
  "10.0.0.5|/data03/autumn"
  "10.0.0.6|/data03/autumn"
)

# ---- partition server(s) ---------------------------------------------------
# Each entry = one PS host. Instance i gets psid i+1 and base port
# PS_BASE_PORT+i*PS_PORT_STRIDE (per-partition listeners climb monotonically
# from the base, so the stride reserves headroom when >1 PS shares a host).
PS_HOSTS=(10.0.0.9)
PS_BASE_PORT=9301
PS_PORT_STRIDE=200

# ---- bootstrap (one-shot, guarded) -----------------------------------------
# Leave blank for auto: replication = min(3,#EN)+0; EC by node count
# (#EN<=3 → none, ==4 → 3+1, >=5 → 4+1). Override explicitly if needed.
REPLICATION=""        # e.g. "3+0"
EC_LOG=""             # "" = auto | "off" | "K+M"
EC_ROW=""
PRESPLIT=""           # e.g. "8" → 8 pre-split partitions at bootstrap

# ---- PS tunables (optional AUTUMN_* passthrough) ---------------------------
# Any AUTUMN_PS_* / AUTUMN_* var exported here is translated to the matching
# autumn-ps flag by autumn-deploy (same table as cluster.sh). Examples:
# export AUTUMN_SST_BLOCK_CACHE_BYTES=536870912
# export AUTUMN_PS_GC_PARALLELISM=4
