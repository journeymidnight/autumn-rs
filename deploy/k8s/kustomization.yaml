# kubectl apply -k deploy/k8s
#
# Applies namespace + ConfigMap + etcd + manager + extent-node + partition-server
# + the one-shot bootstrap Job. Ordering is handled by the entrypoints' wait
# loops (each role waits for the manager leader; bootstrap also waits for
# AUTUMN_EXPECT_NODES extent nodes Online), so apply order does not matter.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass.yaml
  - configmap.yaml
  - etcd.yaml
  - manager.yaml
  - extent-node.yaml
  - partition-server.yaml
  - bootstrap-job.yaml

# This base is a GENERIC reference. Cluster-specific values (image ref, node
# pinning, StorageClass names/sizes, registry mirrors, replica counts) do NOT
# belong here — put them in an overlay that lists this dir as its base. See
# deploy/overlays/vke for a worked Volcengine example, and the "Per-cluster
# overlay" section of docs/k8s_deploy.md.
#
# Override the image centrally (or, preferably, from the overlay):
#   images:
#     - name: autumn-rs
#       newName: <your-registry>/autumn-rs
#       newTag: v1.2.3
images:
  - name: autumn-rs
    newName: autumn-rs
    newTag: latest
