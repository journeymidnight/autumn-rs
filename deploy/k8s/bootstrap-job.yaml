# One-shot cluster bootstrap (create streams + initial partition). `autumn-op
# bootstrap` is NOT idempotent — a second run creates DUPLICATE streams — so
# this runs as a Job (not a Deployment) and the entrypoint guards it: it skips
# if streams already exist (leader-gated `info --full`). The Job waits for the
# manager leader + AUTUMN_EXPECT_NODES extent nodes Online before creating
# streams. Safe to re-apply; converges to a single bootstrap.
apiVersion: batch/v1
kind: Job
metadata:
  name: autumn-bootstrap
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 10
  # Reap the finished Job automatically 5 min after completion.
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autumn
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false   # binaries use ConfigMap+DNS, not service-link env vars (see manager.yaml)
      containers:
        - name: bootstrap
          image: autumn-rs:latest
          imagePullPolicy: IfNotPresent
          args: ["bootstrap"]
          envFrom:
            - configMapRef: { name: autumn-config }
          # Every autumn-op call (info, list-nodes, bootstrap) proves the
          # cluster secret; the ConfigMap's AUTUMN_CLUSTER_SECRET_FILE names
          # this mount. Required: without it the Job fails loudly.
          volumeMounts:
            - name: cluster-secret
              mountPath: /etc/autumn/cluster
              readOnly: true
      volumes:
        - name: cluster-secret
          secret:
            secretName: autumn-cluster-secret
            defaultMode: 0400
