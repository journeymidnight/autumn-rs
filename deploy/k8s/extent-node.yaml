# Data plane. The manager keys each EN's identity on its advertise address and
# an EN NEVER re-registers a new address on restart — so the advertise address
# MUST survive pod rescheduling. A pod IP does not; a per-pod ClusterIP Service
# does. Each EN therefore gets its OWN ClusterIP Service (autumn-en-<ordinal>),
# and the entrypoint advertises that stable ClusterIP.
#
# Each per-pod Service exposes BOTH ports the manager dials:
#   9101  data plane (append/read; PS connects here)
#   10101 control plane (df / recovery; = data port + 1000, derived by
#         `autumn-op format`). Omitting it silently breaks recovery.
#
# SCALING: to run N extent nodes, set the StatefulSet replicas to N AND add a
# per-pod Service autumn-en-<i> for each new ordinal (and bump
# AUTUMN_EXPECT_NODES in the ConfigMap). See docs/k8s_deploy.md.
---
apiVersion: v1
kind: Service
metadata:
  name: autumn-en            # headless — StatefulSet serviceName + pod DNS
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
  ports:
    - { name: data, port: 9101, targetPort: 9101 }
    - { name: control, port: 10101, targetPort: 10101 }
---
apiVersion: v1
kind: Service
metadata:
  name: autumn-en-0          # stable ClusterIP for pod autumn-en-0
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
    statefulset.kubernetes.io/pod-name: autumn-en-0
  ports:
    - { name: data, port: 9101, targetPort: 9101 }
    - { name: control, port: 10101, targetPort: 10101 }
---
apiVersion: v1
kind: Service
metadata:
  name: autumn-en-1
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
    statefulset.kubernetes.io/pod-name: autumn-en-1
  ports:
    - { name: data, port: 9101, targetPort: 9101 }
    - { name: control, port: 10101, targetPort: 10101 }
---
apiVersion: v1
kind: Service
metadata:
  name: autumn-en-2
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
    statefulset.kubernetes.io/pod-name: autumn-en-2
  ports:
    - { name: data, port: 9101, targetPort: 9101 }
    - { name: control, port: 10101, targetPort: 10101 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: autumn-en
  namespace: autumn
  labels:
    app.kubernetes.io/name: autumn
    app.kubernetes.io/component: extent-node
spec:
  serviceName: autumn-en
  replicas: 3
  podManagementPolicy: Parallel   # ENs are independent; bring them up together
  selector:
    matchLabels:
      app.kubernetes.io/name: autumn
      app.kubernetes.io/component: extent-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autumn
        app.kubernetes.io/component: extent-node
    spec:
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false   # binaries use ConfigMap+DNS, not service-link env vars (see manager.yaml)
      # Spread ENs across nodes so replication-factor copies don't share a
      # failure domain. Preferred (not required) so a single-node dev cluster
      # (kind/minikube) still schedules all replicas. For production add a
      # PodDisruptionBudget too.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: autumn
                    app.kubernetes.io/component: extent-node
      containers:
        - name: extent-node
          image: autumn-rs:latest
          imagePullPolicy: IfNotPresent
          args: ["extent-node"]
          envFrom:
            - configMapRef: { name: autumn-config }
          env:
            # Advertise this pod's own per-pod Service, by its FULL FQDN. NOT the
            # bare pod name: Kubernetes writes an /etc/hosts entry mapping the
            # bare name (== the pod hostname, since the per-pod Service is named
            # after the pod) to the POD IP, and `getent` consults files before
            # DNS — so a bare-name lookup returns the ephemeral pod IP and every
            # pod reschedule registers a phantom node. The FQDN
            # <pod>.<ns>.svc.cluster.local is not in /etc/hosts, so it resolves
            # via DNS to the stable per-pod Service ClusterIP.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AUTUMN_ADVERTISE_NAME
              value: "$(POD_NAME).$(POD_NAMESPACE).svc.cluster.local"
            - name: AUTUMN_EXTENT_DATA
              value: /data/autumn
          ports:
            - { name: data, containerPort: 9101 }
            - { name: control, containerPort: 10101 }
          readinessProbe:
            tcpSocket: { port: 9101 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "1", memory: "1Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Local disk — autumn replicates across ENs itself (RF=3), so extent data
        # must NOT sit on a self-replicating network volume. See storageclass.yaml
        # for the pin-to-node / RF=3-handles-node-loss model.
        storageClassName: autumn-en-local
        resources:
          requests:
            storage: 20Gi     # tune to your dataset; extents land here
